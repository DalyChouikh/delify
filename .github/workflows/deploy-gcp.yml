# Deploy Delify to Google Cloud Platform (Compute Engine)
# Legacy workflow (manual trigger only)
#
# This workflow:
# 1. Builds the bot Docker image and pushes it to Artifact Registry
# 2. SSHes into the GCE VM
# 3. Fetches secrets from Secret Manager
# 4. Deploys both Lavalink and Bot containers via docker-compose

name: Deploy to GCP

on:
  workflow_dispatch: # Legacy manual workflow only

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}                      # e.g., europe-west1
  GCP_ZONE: ${{ secrets.GCP_ZONE }}                          # e.g., europe-west1-b
  GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}                  # e.g., delify-vm
  ARTIFACT_REGISTRY_REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }} # e.g., delify
  IMAGE_NAME: delify-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      # ============================================
      # Checkout and Setup
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # Authenticate to GCP via Workload Identity Federation
      # ============================================
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ============================================
      # Build and Push Bot Image to Artifact Registry
      # ============================================
      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Bot image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}"
          docker build \
            -t "${IMAGE_URI}:${{ github.sha }}" \
            -t "${IMAGE_URI}:latest" \
            -f Dockerfile .
          docker push "${IMAGE_URI}:${{ github.sha }}"
          docker push "${IMAGE_URI}:latest"

      # ============================================
      # Retrieve Secrets from Google Secret Manager
      # ============================================
      - name: Get secrets from Secret Manager
        id: secrets
        run: |
          fetch_secret() {
            local name=$1
            local value
            value=$(gcloud secrets versions access latest --secret="$name" --project="${{ env.GCP_PROJECT_ID }}" 2>/dev/null || echo "")
            echo "${name}=${value}" >> $GITHUB_OUTPUT
          }

          fetch_secret "DISCORD_TOKEN"
          fetch_secret "DISCORD_GUILD_IDS"
          fetch_secret "DEVELOPER_USER_ID"
          fetch_secret "LAVALINK_PASSWORD"
          fetch_secret "SPOTIFY_CLIENT_ID"
          fetch_secret "SPOTIFY_CLIENT_SECRET"
          fetch_secret "RAPIDAPI_KEY"
          fetch_secret "RAPIDAPI_HOST"
          fetch_secret "INACTIVITY_TIMEOUT"
          fetch_secret "YOUTUBE_OAUTH_REFRESH_TOKEN"

      # ============================================
      # Deploy to GCE VM
      # ============================================
      - name: Deploy to GCE Instance
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          # Create .env file content (will be written on the VM)
          ENV_CONTENT=$(cat <<'ENVEOF'
          # Auto-generated by GitHub Actions deploy
          DISCORD_TOKEN=${{ steps.secrets.outputs.DISCORD_TOKEN }}
          DISCORD_GUILD_IDS=${{ steps.secrets.outputs.DISCORD_GUILD_IDS }}
          DEVELOPER_USER_ID=${{ steps.secrets.outputs.DEVELOPER_USER_ID }}
          LAVALINK_PASSWORD=${{ steps.secrets.outputs.LAVALINK_PASSWORD }}
          SPOTIFY_CLIENT_ID=${{ steps.secrets.outputs.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ steps.secrets.outputs.SPOTIFY_CLIENT_SECRET }}
          RAPIDAPI_KEY=${{ steps.secrets.outputs.RAPIDAPI_KEY }}
          RAPIDAPI_HOST=${{ steps.secrets.outputs.RAPIDAPI_HOST }}
          INACTIVITY_TIMEOUT=${{ steps.secrets.outputs.INACTIVITY_TIMEOUT }}
          YOUTUBE_OAUTH_REFRESH_TOKEN=${{ steps.secrets.outputs.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          BOT_IMAGE=${IMAGE_URI}
          ENVEOF
          )

          # SSH into the VM and deploy
          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --command="
              set -e

              # Authenticate Docker to Artifact Registry
              gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

              # Ensure deploy directory exists
              mkdir -p ~/delify

              # Write .env file
              cat > ~/delify/.env << 'EOF'
          DISCORD_TOKEN=${{ steps.secrets.outputs.DISCORD_TOKEN }}
          DISCORD_GUILD_IDS=${{ steps.secrets.outputs.DISCORD_GUILD_IDS }}
          DEVELOPER_USER_ID=${{ steps.secrets.outputs.DEVELOPER_USER_ID }}
          LAVALINK_PASSWORD=${{ steps.secrets.outputs.LAVALINK_PASSWORD }}
          SPOTIFY_CLIENT_ID=${{ steps.secrets.outputs.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ steps.secrets.outputs.SPOTIFY_CLIENT_SECRET }}
          RAPIDAPI_KEY=${{ steps.secrets.outputs.RAPIDAPI_KEY }}
          RAPIDAPI_HOST=${{ steps.secrets.outputs.RAPIDAPI_HOST }}
          INACTIVITY_TIMEOUT=${{ steps.secrets.outputs.INACTIVITY_TIMEOUT }}
          YOUTUBE_OAUTH_REFRESH_TOKEN=${{ steps.secrets.outputs.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          BOT_IMAGE=${IMAGE_URI}
          EOF

              # Write docker-compose.prod.yml
              cat > ~/delify/docker-compose.prod.yml << 'COMPOSEOF'
          services:
            lavalink:
              image: ghcr.io/lavalink-devs/lavalink:4
              container_name: delify-lavalink
              restart: unless-stopped
              environment:
                SERVER_PORT: 2333
                SERVER_ADDRESS: 0.0.0.0
                LAVALINK_SERVER_PASSWORD: \${LAVALINK_PASSWORD:-youshallnotpass}
                LAVALINK_SERVER_SOURCES_YOUTUBE: \"false\"
                LAVALINK_SERVER_SOURCES_BANDCAMP: \"true\"
                LAVALINK_SERVER_SOURCES_SOUNDCLOUD: \"true\"
                LAVALINK_SERVER_SOURCES_TWITCH: \"true\"
                LAVALINK_SERVER_SOURCES_VIMEO: \"true\"
                LAVALINK_SERVER_SOURCES_HTTP: \"true\"
                LAVALINK_SERVER_SOURCES_LOCAL: \"false\"
                LAVALINK_PLUGINS_0_DEPENDENCY: \"dev.lavalink.youtube:youtube-plugin:1.18.0\"
                LAVALINK_PLUGINS_0_SNAPSHOT: \"false\"
                LAVALINK_PLUGINS_1_DEPENDENCY: \"com.github.topi314.lavasrc:lavasrc-plugin:4.8.1\"
                LAVALINK_PLUGINS_1_SNAPSHOT: \"false\"
                PLUGINS_YOUTUBE_ENABLED: \"true\"
                PLUGINS_YOUTUBE_CLIENTS_0: TV
                PLUGINS_YOUTUBE_CLIENTS_1: ANDROID_VR
                PLUGINS_YOUTUBE_CLIENTS_2: WEB
                PLUGINS_YOUTUBE_CLIENTS_3: WEBEMBEDDED
                PLUGINS_YOUTUBE_CLIENTS_4: MUSIC
                PLUGINS_YOUTUBE_OAUTH_ENABLED: \"true\"
                PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN: \${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
                PLUGINS_YOUTUBE_REMOTECIPHER_URL: \"https://cipher.kikkia.dev/\"
                PLUGINS_YOUTUBE_REMOTECIPHER_USERAGENT: delify-bot
                LOGGING_LEVEL_DEV_LAVALINK_YOUTUBE_HTTP_YOUTUBEOAUTH2HANDLER: INFO
                PLUGINS_LAVASRC_PROVIDERS_0: \"ytsearch:\\\"%ISRC%\\\"\"
                PLUGINS_LAVASRC_PROVIDERS_1: \"ytsearch:%QUERY%\"
                PLUGINS_LAVASRC_SOURCES_SPOTIFY: \"true\"
                PLUGINS_LAVASRC_SPOTIFY_CLIENTID: \${SPOTIFY_CLIENT_ID}
                PLUGINS_LAVASRC_SPOTIFY_CLIENTSECRET: \${SPOTIFY_CLIENT_SECRET}
                PLUGINS_LAVASRC_SPOTIFY_COUNTRYCODE: US
                PLUGINS_LAVASRC_SPOTIFY_PLAYLISTLOADLIMIT: \"6\"
                PLUGINS_LAVASRC_SPOTIFY_ALBUMLOADLIMIT: \"6\"
                PLUGINS_LAVASRC_SOURCES_DEEZER: \"false\"
                PLUGINS_LAVASRC_SOURCES_APPLEMUSIC: \"false\"
                PLUGINS_LAVASRC_SOURCES_YOUTUBE: \"true\"
                LOGGING_LEVEL_ROOT: INFO
                LOGGING_LEVEL_LAVALINK: INFO
              healthcheck:
                test: [\"CMD-SHELL\", \"curl -s --connect-timeout 5 http://localhost:2333/version > /dev/null\"]
                interval: 10s
                timeout: 10s
                retries: 10
                start_period: 30s
              networks:
                - delify-network

            bot:
              image: \${BOT_IMAGE}
              container_name: delify-bot
              restart: unless-stopped
              depends_on:
                lavalink:
                  condition: service_healthy
              environment:
                DISCORD_TOKEN: \${DISCORD_TOKEN}
                DISCORD_GUILD_IDS: \${DISCORD_GUILD_IDS:-}
                DEVELOPER_USER_ID: \${DEVELOPER_USER_ID:-}
                LAVALINK_HOST: lavalink
                LAVALINK_PORT: \"2333\"
                LAVALINK_PASSWORD: \${LAVALINK_PASSWORD:-youshallnotpass}
                LAVALINK_SECURE: \"false\"
                RAPIDAPI_KEY: \${RAPIDAPI_KEY:-}
                RAPIDAPI_HOST: \${RAPIDAPI_HOST:-genius-song-lyrics1.p.rapidapi.com}
                LOG_LEVEL: info
                INACTIVITY_TIMEOUT: \${INACTIVITY_TIMEOUT:-30}
              networks:
                - delify-network

          networks:
            delify-network:
              driver: bridge
          COMPOSEOF

              # Pull latest images and restart
              cd ~/delify
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

              # Clean up old images
              docker image prune -f

              echo 'Deployment complete!'
            "

      # ============================================
      # Output Deployment Info
      # ============================================
      - name: Deployment Summary
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🚀 Deployment Complete!"
          echo "========================"
          echo "Bot Image: ${IMAGE_URI}"
          echo "VM Instance: ${{ env.GCE_INSTANCE }} (${{ env.GCP_ZONE }})"
          echo ""
          echo "View logs with:"
          echo "  gcloud compute ssh ${{ env.GCE_INSTANCE }} --zone=${{ env.GCP_ZONE }} --command='cd ~/delify && docker compose -f docker-compose.prod.yml logs -f'"
