name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy-lavalink:
    name: Deploy Lavalink (Fly)
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_PRIMARY_REGION: ${{ secrets.FLY_PRIMARY_REGION }}
      LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate required secrets
        run: |
          required=(FLY_API_TOKEN LAVALINK_PASSWORD SPOTIFY_CLIENT_ID SPOTIFY_CLIENT_SECRET)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

      - name: Ensure Lavalink app exists
        run: |
          flyctl status -a delify-lavalink >/dev/null 2>&1 || flyctl apps create delify-lavalink

      - name: Remove stale created Lavalink machines
        run: |
          set -euo pipefail
          machine_ids="$(flyctl machine list -a delify-lavalink --json | python -c 'import json,sys; machines=json.load(sys.stdin); print(\" \".join(m[\"id\"] for m in machines if m.get(\"state\") == \"created\"))')"
          if [ -n "${machine_ids}" ]; then
            for machine_id in ${machine_ids}; do
              echo "Destroying stale machine: ${machine_id}"
              flyctl machine destroy "${machine_id}" -a delify-lavalink -f
            done
          fi

      - name: Sync Lavalink secrets
        run: |
          set -euo pipefail
          secret_args=(
            "LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}"
            "PLUGINS_LAVASRC_SPOTIFY_CLIENTID=${SPOTIFY_CLIENT_ID}"
            "PLUGINS_LAVASRC_SPOTIFY_CLIENTSECRET=${SPOTIFY_CLIENT_SECRET}"
          )

          if [ -n "${YOUTUBE_OAUTH_REFRESH_TOKEN:-}" ]; then
            secret_args+=("PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN}")
          fi

          flyctl secrets set -a delify-lavalink --stage "${secret_args[@]}"

      - name: Deploy Lavalink app
        run: |
          set -euo pipefail
          deploy_args=(
            -a delify-lavalink
            -c fly.lavalink.toml
            --remote-only
            --flycast
            --no-public-ips
            --ha=false
            --wait-timeout=15m
          )
          if [ -n "${FLY_PRIMARY_REGION:-}" ]; then
            deploy_args+=(--primary-region "${FLY_PRIMARY_REGION}")
          fi
          flyctl deploy "${deploy_args[@]}"

      - name: Lavalink diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "=== fly status ==="
          flyctl status -a delify-lavalink
          echo "=== machine list ==="
          flyctl machine list -a delify-lavalink
          echo "=== recent logs (45s capture) ==="
          timeout 45s flyctl logs -a delify-lavalink
          true

  deploy-bot:
    name: Deploy Bot (Fly)
    runs-on: ubuntu-latest
    needs: deploy-lavalink
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_PRIMARY_REGION: ${{ secrets.FLY_PRIMARY_REGION }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD }}
      DISCORD_GUILD_IDS: ${{ secrets.DISCORD_GUILD_IDS }}
      DEVELOPER_USER_ID: ${{ secrets.DEVELOPER_USER_ID }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
      INACTIVITY_TIMEOUT: ${{ secrets.INACTIVITY_TIMEOUT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate required secrets
        run: |
          required=(FLY_API_TOKEN DISCORD_TOKEN LAVALINK_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

      - name: Ensure Bot app exists
        run: |
          flyctl status -a delify-bot >/dev/null 2>&1 || flyctl apps create delify-bot

      - name: Sync Bot secrets
        run: |
          set -euo pipefail
          secret_args=(
            "DISCORD_TOKEN=${DISCORD_TOKEN}"
            "LAVALINK_PASSWORD=${LAVALINK_PASSWORD}"
          )

          if [ -n "${DISCORD_GUILD_IDS:-}" ]; then
            secret_args+=("DISCORD_GUILD_IDS=${DISCORD_GUILD_IDS}")
          fi
          if [ -n "${DEVELOPER_USER_ID:-}" ]; then
            secret_args+=("DEVELOPER_USER_ID=${DEVELOPER_USER_ID}")
          fi
          if [ -n "${RAPIDAPI_KEY:-}" ]; then
            secret_args+=("RAPIDAPI_KEY=${RAPIDAPI_KEY}")
          fi
          if [ -n "${RAPIDAPI_HOST:-}" ]; then
            secret_args+=("RAPIDAPI_HOST=${RAPIDAPI_HOST}")
          fi
          if [ -n "${INACTIVITY_TIMEOUT:-}" ]; then
            secret_args+=("INACTIVITY_TIMEOUT=${INACTIVITY_TIMEOUT}")
          fi

          flyctl secrets set -a delify-bot --stage "${secret_args[@]}"

      - name: Deploy Bot app
        run: |
          set -euo pipefail
          deploy_args=(
            -a delify-bot
            -c fly.bot.toml
            --remote-only
            --no-public-ips
            --ha=false
            --wait-timeout=15m
          )
          if [ -n "${FLY_PRIMARY_REGION:-}" ]; then
            deploy_args+=(--primary-region "${FLY_PRIMARY_REGION}")
          fi
          flyctl deploy "${deploy_args[@]}"

      - name: Bot diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "=== fly status ==="
          flyctl status -a delify-bot
          echo "=== machine list ==="
          flyctl machine list -a delify-bot
          echo "=== recent logs (45s capture) ==="
          timeout 45s flyctl logs -a delify-bot
          true
