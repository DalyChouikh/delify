name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Race tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Validate Compose
        env:
          DISCORD_TOKEN: test-token
          SPOTIFY_CLIENT_ID: test-client
          SPOTIFY_CLIENT_SECRET: test-secret
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Build Docker image
        run: docker build -t delify-ci .
      - name: Build Lavalink image and test CDN fallback
        run: docker build -f docker/lavalink/Dockerfile -t delify-lavalink-ci .
