app = "delify-lavalink"

[build]
  image = "ghcr.io/lavalink-devs/lavalink:800c2ae"

[env]
  SERVER_PORT = "2333"
  SERVER_ADDRESS = "0.0.0.0"

  LAVALINK_SERVER_SOURCES_YOUTUBE = "false"
  LAVALINK_SERVER_SOURCES_BANDCAMP = "true"
  LAVALINK_SERVER_SOURCES_SOUNDCLOUD = "true"
  LAVALINK_SERVER_SOURCES_TWITCH = "true"
  LAVALINK_SERVER_SOURCES_VIMEO = "true"
  LAVALINK_SERVER_SOURCES_HTTP = "true"
  LAVALINK_SERVER_SOURCES_LOCAL = "false"

  LAVALINK_PLUGINS_0_DEPENDENCY = "dev.lavalink.youtube:youtube-plugin:1.18.0"
  LAVALINK_PLUGINS_0_SNAPSHOT = "false"
  LAVALINK_PLUGINS_1_DEPENDENCY = "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
  LAVALINK_PLUGINS_1_SNAPSHOT = "false"

  PLUGINS_YOUTUBE_ENABLED = "true"
  PLUGINS_YOUTUBE_CLIENTS_0 = "TV"
  PLUGINS_YOUTUBE_CLIENTS_1 = "ANDROID_VR"
  PLUGINS_YOUTUBE_CLIENTS_2 = "WEB"
  PLUGINS_YOUTUBE_CLIENTS_3 = "WEBEMBEDDED"
  PLUGINS_YOUTUBE_CLIENTS_4 = "MUSIC"
  PLUGINS_YOUTUBE_OAUTH_ENABLED = "true"
  PLUGINS_YOUTUBE_REMOTECIPHER_URL = "https://cipher.kikkia.dev/"
  PLUGINS_YOUTUBE_REMOTECIPHER_USERAGENT = "delify-bot"
  LOGGING_LEVEL_DEV_LAVALINK_YOUTUBE_HTTP_YOUTUBEOAUTH2HANDLER = "INFO"

  PLUGINS_LAVASRC_PROVIDERS_0 = "ytsearch:\"%ISRC%\""
  PLUGINS_LAVASRC_PROVIDERS_1 = "ytsearch:%QUERY%"
  PLUGINS_LAVASRC_SOURCES_SPOTIFY = "true"
  PLUGINS_LAVASRC_SPOTIFY_COUNTRYCODE = "US"
  PLUGINS_LAVASRC_SPOTIFY_PLAYLISTLOADLIMIT = "6"
  PLUGINS_LAVASRC_SPOTIFY_ALBUMLOADLIMIT = "6"
  PLUGINS_LAVASRC_SOURCES_DEEZER = "false"
  PLUGINS_LAVASRC_SOURCES_APPLEMUSIC = "false"
  PLUGINS_LAVASRC_SOURCES_YOUTUBE = "true"

  LOGGING_LEVEL_ROOT = "INFO"
  LOGGING_LEVEL_LAVALINK = "INFO"
  LOGGING_LEVEL_DEV_LAVALINK_YOUTUBE = "INFO"

  # Cap JVM heap — leaves ~150mb for JVM non-heap + OS overhead within 512mb container
  JAVA_TOOL_OPTIONS = "-Xmx350m -Xms128m"

[[services]]
  internal_port = 2333
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 2333

  [[services.tcp_checks]]
    grace_period = "40s"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
